<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>sproutvgc · Pokémon Champions dex</title>
    <meta
      name="description"
      content="sproutvgc: a competitive Pokémon Champions dex, up to date with Regulation %VITE_REGULATION%. Type chart, type matchups, every type in detail and a type quiz."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="sproutvgc · Pokémon Champions dex" />
    <meta
      property="og:description"
      content="A competitive Pokémon Champions dex, up to date with Regulation %VITE_REGULATION%."
    />
    <!-- The type badge names' font (--badge-family in src/styles/main.css). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=swap" />
    <!-- EXPERIMENT: the Champions palette's display and body faces. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@1,600;1,700&family=Inter:wght@400;600;700&display=swap"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('sproutvgc.theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
      // EXPERIMENT: the Champions palette (src/styles/champions.css), on with ?palette=champions, off with ?palette=off.
      try {
        var q = new URLSearchParams(location.search).get('palette')
        if (q === 'champions') localStorage.setItem('sproutvgc.palette', q)
        else if (q === 'off') localStorage.removeItem('sproutvgc.palette')
        var p = q === 'champions' ? q : q === 'off' ? null : localStorage.getItem('sproutvgc.palette')
        if (p === 'champions') document.documentElement.dataset.palette = p
      } catch (e) {}
    </script>
    <!-- Umami analytics: only on the live site, and without the query, which the pages rewrite on every choice. -->
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="bc4fd636-579e-4534-8ea3-9ca2dfb88c0c"
      data-domains="kpagcha.github.io"
      data-exclude-search="true"
    ></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
