name: Refresh tournaments

# Official events are mostly on weekends, and Limitless VGC publishes their teams over the days after. Every Tuesday
# this pins every event each regulation has there (`gen-data --update-tournaments`), reads the recent ones' standings
# again and the list of those to come, and, when anything changed, opens a pull request with the regenerated data and
# merges it, deploying the site, when it touches only the tournaments' data (else it stays open for review). A week
# already proposed isn't proposed again (while its pull request is open: merged, its branch is gone). The deploy also
# starts it as soon as an event it reads live is over with every team list in (`deploy.yml`).
on:
  schedule:
    - cron: '0 6 * * 2'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # To start the deploy: a merge pushed with the workflow's own token doesn't trigger it on its own.
  actions: write

# One at a time, the deploy's start and the schedule's not racing for the week's branch.
concurrency:
  group: tournaments
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The generator's downloads (Showdown's checkout, PokéAPI's CSVs, the sprites, Smogon's files, Limitless VGC's
      # pages), so a run regenerates from the same pins without fetching them all again.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache
          key: gen-data-${{ hashFiles('scripts/sources.json') }}
          restore-keys: gen-data-
      - run: npm run gen-data -- --update-tournaments
      - run: npm run lint
      - run: npm run build
      - name: Open a pull request if the tournaments changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo 'No new tournament data.'; exit 0; fi
          week=$(date -u +%G-W%V)
          branch="tournaments/$week"
          if git ls-remote --exit-code origin "refs/heads/$branch" > /dev/null; then echo "$week already proposed."; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898099+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add -A scripts/sources.json src/data/generated
          git commit -m "data: the official tournaments as of $week"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "data: the official tournaments as of $week" --body "The tournaments from Limitless VGC as of $week (\`gen-data --update-tournaments\`), opened by the weekly refresh workflow. Lint and build passed on it.

          Check the diff touches only \`src/data/generated/tournaments/\`, \`source.json\` and \`sources.json\`: anything else means a regenerated file changed with the same pins (most likely Showdown's sprites, fetched again when the cache is empty)."
          # Merged at once, and the site deployed, when the diff stays within the data it refreshes; anything else is left
          # open for review.
          other=$(git diff --name-only HEAD~1 HEAD | grep -vE '^(src/data/generated/tournaments/|src/data/generated/source\.json$|scripts/sources\.json$)' || true)
          if [ -n "$other" ]; then
            echo "::warning title=Left for review::The diff touches more than the tournaments, so the pull request stays open:%0A$other"
            exit 0
          fi
          gh pr merge "$branch" --merge --delete-branch
          gh workflow run deploy.yml --ref main
