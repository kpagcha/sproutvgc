name: Deploy to GitHub Pages

# On every push to main, every half hour from Friday to Monday (UTC), when the official tournaments are played, and every
# three hours from Tuesday to Thursday, for the team lists Limitless VGC publishes in the days after: each build reads
# the tournaments under way (or just over, not generated yet) from it first (`npm run live-tournaments`, never
# committed), so the site shows them live. A scheduled run deploys only when what it read changed since the last deploy,
# and fails rather than deploy when it couldn't read them (which would take the live events off the site); a push
# deploys anyway, the run warning that it couldn't. An event it finds over with every team list in starts the
# tournaments' refresh (`tournaments.yml`), which generates it for good, rather than leave it live until Tuesday's.
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * 5,6,0,1'
    - cron: '0 */3 * * 2,3,4'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # To start the tournaments' refresh.
  actions: write

# One deployment at a time; don't cancel a deployment that's already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.changed.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Limitless VGC's responses, team lists above all (a thousand a Regional, each read once), kept from run to run,
      # with the live data last deployed's hash.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/limitlessvgc
          key: limitless-live-${{ github.run_id }}
          restore-keys: limitless-live-
      - id: live
        run: npm run live-tournaments
      - name: Whether to deploy
        id: changed
        run: |
          if [ "${{ steps.live.outputs.failed }}" = true ] && [ "${{ github.event_name }}" = schedule ]; then
            echo '::error title=Live tournaments::Limitless VGC could not be read: not deploying, so the site keeps the live events it has.'
            exit 1
          fi
          hash=$(cat src/data/generated/live/* 2>/dev/null | sha256sum | cut -d' ' -f1)
          last=$(cat node_modules/.cache/limitlessvgc/live-deployed 2>/dev/null || true)
          if [ "${{ github.event_name }}" != schedule ] || [ "$hash" != "$last" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
            mkdir -p node_modules/.cache/limitlessvgc
            echo "$hash" > node_modules/.cache/limitlessvgc/live-deployed
          else
            echo 'The tournaments under way are as last deployed.'
          fi
      # An event over with every team list in has nothing left to come: the refresh generates it for good, so the trends,
      # builds and win rates count it. Asked once per event every six hours (kept in the cache beside the hash), so a
      # refresh that failed, or found it not on Limitless VGC's lists yet, is asked again later, not on every run.
      - name: Refresh the tournaments when one is over
        if: steps.live.outputs.complete != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asked=node_modules/.cache/limitlessvgc/refresh-asked
          now=$(date +%s)
          due=
          for t in $(echo '${{ steps.live.outputs.complete }}' | tr , ' '); do
            last=$(grep "^$t " "$asked" 2>/dev/null | tail -1 | cut -d' ' -f2)
            if [ -z "$last" ] || [ $((now - last)) -ge 21600 ]; then due="$due $t"; fi
          done
          if [ -z "$due" ]; then echo 'The refresh was asked for already.'; exit 0; fi
          echo "Over with every team list in:$due. Starting the tournaments' refresh."
          gh workflow run tournaments.yml --ref main
          mkdir -p "$(dirname "$asked")"
          for t in $due; do echo "$t $now" >> "$asked"; done
      - if: steps.changed.outputs.deploy == 'true'
        run: npm run lint
      - if: steps.changed.outputs.deploy == 'true'
        run: npm run build
      - if: steps.changed.outputs.deploy == 'true'
        uses: actions/configure-pages@v6
      - if: steps.changed.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
