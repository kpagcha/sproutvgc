name: Deploy to GitHub Pages

# On every push to main, and every half hour from Friday to Monday (UTC), when the official tournaments are played: each
# build reads the tournaments under way from Limitless VGC first (`npm run live-tournaments`, never committed), so the
# site shows them live. A scheduled run deploys only when what it read changed since the last deploy.
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * 5,6,0,1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a deployment that's already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.changed.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Limitless VGC's responses, team lists above all (a thousand a Regional, each read once), kept from run to run,
      # with the live data last deployed's hash.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/limitlessvgc
          key: limitless-live-${{ github.run_id }}
          restore-keys: limitless-live-
      - run: npm run live-tournaments
      - name: Whether to deploy
        id: changed
        run: |
          hash=$(cat src/data/generated/live/* 2>/dev/null | sha256sum | cut -d' ' -f1)
          last=$(cat node_modules/.cache/limitlessvgc/live-deployed 2>/dev/null || true)
          if [ "${{ github.event_name }}" != schedule ] || [ "$hash" != "$last" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
            mkdir -p node_modules/.cache/limitlessvgc
            echo "$hash" > node_modules/.cache/limitlessvgc/live-deployed
          else
            echo 'The tournaments under way are as last deployed.'
          fi
      - if: steps.changed.outputs.deploy == 'true'
        run: npm run lint
      - if: steps.changed.outputs.deploy == 'true'
        run: npm run build
      - if: steps.changed.outputs.deploy == 'true'
        uses: actions/configure-pages@v6
      - if: steps.changed.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
